# Publishes the game folder to the gh-pages branch, which GitHub Pages serves as the public website.
name: Publish website
on:
  push:
    branches: [main]
    paths: ['game/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push game folder to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix game -b pages-tmp
          git push -f origin pages-tmp:gh-pages

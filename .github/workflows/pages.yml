# Publishes the game folder to the gh-pages branch, which GitHub Pages serves as the public website.
name: Publish website
on:
  push:
    branches: [main]
    paths: ['game/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push game folder to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix game -b pages-tmp
          # stamp the build so index.html always loads the newest game.js (see the loader in index.html)
          git checkout -q pages-tmp
          echo "$GITHUB_SHA" > version.txt
          # every module imports the others with the same stamp, so a browser can never mix an old cached file with new ones
          sed -i -E "s#from '\./([a-z]+)\.js'#from './\1.js?v=$GITHUB_SHA'#g" *.js
          git add -A && git commit -q -m "version $GITHUB_SHA"
          git push -f origin pages-tmp:gh-pages
